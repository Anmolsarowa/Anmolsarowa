<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="320">
  <defs>
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E6EDF3"/>
      <stop offset="100%" stop-color="#8B949E"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="50%" stop-color="#FF9100"/>
      <stop offset="100%" stop-color="#FF1744"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes starPulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes floatRocket {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
    }
    @keyframes thrustFlame {
      0%, 100% { transform: scaleY(1) scaleX(1); opacity: 0.85; }
      50% { transform: scaleY(1.4) scaleX(1.15); opacity: 1; }
    }
    @keyframes streamText {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0px); }
    }

    .bg { fill: url(#spaceBg); rx: 16px; }
    .star-1 { animation: starPulse 2s infinite ease-in-out; transform-origin: center; }
    .star-2 { animation: starPulse 3s infinite ease-in-out 1s; transform-origin: center; }
    .star-3 { animation: starPulse 2.5s infinite ease-in-out 0.5s; transform-origin: center; }

    .rocket-group { animation: floatRocket 3s infinite ease-in-out; }
    .flame-main { animation: thrustFlame 0.2s infinite ease-in-out; transform-origin: 400px 175px; fill: url(#flameGrad); }

    .title-text { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 15px; font-weight: 600; fill: #58A6FF; letter-spacing: 2px; }
    .sub-text { font-family: 'Segoe UI', sans-serif; font-size: 12px; fill: #8B949E; letter-spacing: 1px; }
    .accent-cyan { fill: #00F2FE; font-weight: bold; }
  </style>

  <!-- Background Card -->
  <rect width="100%" height="100%" class="bg" stroke="#30363D" stroke-width="1.5"/>

  <!-- Stars Field -->
  <g>
    <circle cx="80" cy="40" r="1.5" fill="#58A6FF" class="star-1"/>
    <circle cx="150" cy="180" r="2" fill="#FFFFFF" class="star-2"/>
    <circle cx="240" cy="80" r="1" fill="#79C0FF" class="star-3"/>
    <circle cx="320" cy="220" r="1.5" fill="#FFFFFF" class="star-1"/>
    <circle cx="480" cy="50" r="2" fill="#58A6FF" class="star-2"/>
    <circle cx="560" cy="190" r="1" fill="#FFFFFF" class="star-3"/>
    <circle cx="680" cy="70" r="1.5" fill="#79C0FF" class="star-1"/>
    <circle cx="730" cy="230" r="2" fill="#FFFFFF" class="star-2"/>
  </g>

  <!-- Orbit Line -->
  <path d="M 50 200 Q 400 60 750 200" fill="none" stroke="#30363D" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Animated Rocket Assembly -->
  <g class="rocket-group">
    <!-- Flame Thrust -->
    <path d="M 390 175 Q 400 225 410 175 Z" class="flame-main"/>
    <path d="M 394 175 Q 400 205 406 175 Z" fill="#FFFFFF" opacity="0.9"/>

    <!-- Fins -->
    <path d="M 385 145 L 368 175 L 385 170 Z" fill="#FF7B72"/>
    <path d="M 415 145 L 432 175 L 415 170 Z" fill="#FF7B72"/>

    <!-- Main Rocket Fuselage -->
    <path d="M 400 80 C 420 120 415 170 415 170 L 385 170 C 385 170 380 120 400 80 Z" fill="url(#rocketBody)"/>

    <!-- Porthole Window -->
    <circle cx="400" cy="125" r="9" fill="#0D1117" stroke="#58A6FF" stroke-width="2.5"/>
    <circle cx="400" cy="125" r="5" fill="#58A6FF" opacity="0.8"/>

    <!-- Nose Cone Accent -->
    <path d="M 400 80 C 408 95 408 105 408 105 L 392 105 C 392 105 392 95 400 80 Z" fill="#7EE787"/>
  </g>

  <!-- Dynamic Mission Banner -->
  <text x="50%" y="255" text-anchor="middle" class="title-text">
    🚀 THE EVOLUTION OF SCIENCE &amp; CLOUD FRONTIERS
  </text>
  <text x="50%" y="285" text-anchor="middle" class="sub-text">
    EARTH DISCOVERY ➔ SILICON COMPUTATION ➔ <tspan class="accent-cyan">AZURE CLOUD &amp; AI AGENTS</tspan> ➔ DEEP TECH
  </text>
</svg>
